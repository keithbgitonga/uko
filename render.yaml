# Render Blueprint — Uko? API + dispatch console.
# Prereq: a Neon Postgres database; set DATABASE_URL when prompted.
services:
  - type: web
    name: uko-pilot-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: app/services/api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: mkdir -p uploads/driver-documents && node scripts/migrate.mjs && node dist/main.js
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_STORE
        value: postgres
      - key: PERSISTENCE_STORE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SKIP_POSTGIS
        value: "1"
      - key: MIGRATIONS_DIR
        value: ../../db/migrations
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: ALLOW_TEST_LOGINS
        value: "true"       # pilot/testing only — set false before public launch
      - key: DISPATCH_PHONES
        sync: false
      - key: CORS_ORIGINS
        value: https://uko-pilot-dispatch.onrender.com
      - key: EXPOSE_DEV_OTP
        value: "false"
      - key: SMS_PROVIDER
        value: africastalking
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
      - key: DOCUMENTS_REQUIRED
        value: "false"

  - type: web
    name: uko-pilot-dispatch
    runtime: static
    staticPublishPath: ./app/apps/dispatch/web
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
